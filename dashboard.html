function Stars({val}){if(!val)return <span className="text-gray-300 text-xs">—</span>;return(<span className="inline-flex gap-0.5">{[1,2,3,4,5].map(i=>(<span key={i} className={`text-sm ${i<=val?'text-yellow-400':'text-gray-200'}`}>★</span>))}</span>);}

function StatCard({icon,label,value,sub,color='indigo'}){
  const bg={indigo:'bg-indigo-50 border-indigo-100',green:'bg-emerald-50 border-emerald-100',amber:'bg-amber-50 border-amber-100',blue:'bg-blue-50 border-blue-100',rose:'bg-rose-50 border-rose-100',purple:'bg-purple-50 border-purple-100'};
  const txt={indigo:'text-indigo-600',green:'text-emerald-600',amber:'text-amber-600',blue:'text-blue-600',rose:'text-rose-600',purple:'text-purple-600'};
  return(<div className={`${bg[color]} border rounded-2xl p-4 flex flex-col`}><div className="text-2xl mb-1">{icon}</div><div className="text-xs text-gray-400 font-medium mb-1">{label}</div><div className={`text-2xl font-bold ${txt[color]}`}>{value}</div>{sub&&<div className="text-xs text-gray-400 mt-1">{sub}</div>}</div>);
}

function YoYBadge({cur,prev}){const c=parseFloat(cur),p=parseFloat(prev);if(isNaN(c)||isNaN(p)||p===0)return <span className="text-gray-300 text-xs">—</span>;const pct=((c-p)/Math.abs(p)*100).toFixed(1);const up=parseFloat(pct)>0;const zero=Math.abs(parseFloat(pct))<0.5;if(zero)return <span className="text-gray-400 text-xs font-medium">→ 0%</span>;return <span className={`text-xs font-bold ${up?'text-emerald-600':'text-rose-500'}`}>{up?'▲':'▼'} {Math.abs(parseFloat(pct))}%</span>;}

function getWeeksForMonth(y,m){const ld=new Date(y,m,0).getDate();const ranges=[[1,7],[8,14],[15,21],[22,ld]];return ranges.map(([s,e],i)=>{const sm=String(m).padStart(2,'0');return{key:`W${i+1}`,label:`W${i+1}（${m}/${s}–${m}/${e}）`,start:`${y}-${sm}-${String(s).padStart(2,'0')}`,end:`${y}-${sm}-${String(e).padStart(2,'0')}`};});}

function getStaffEntries(name,data){const e=[];data.forEach(r=>{[1,2,3].forEach(i=>{if(r[`s${i}`]===name)e.push({date:r.date,weather:r.weather,c:r[`c${i}`]||0,h:r[`h${i}`]||0,b:r[`b${i}`]||0,remark:r[`r${i}`]||''});});});return e;}

function getStaffList(data){const s=new Set();data.forEach(r=>{[1,2,3].forEach(i=>{if(r[`s${i}`])s.add(r[`s${i}`]);});});return Array.from(s).sort((a,b)=>{const ea=getStaffEntries(a,data),eb=getStaffEntries(b,data);return eb.reduce((s,e)=>s+e.c,0)-ea.reduce((s,e)=>s+e.c,0);});}

function getStaffWeekly(name,data,weeks){const entries=getStaffEntries(name,data);return weeks.map(w=>{const wE=entries.filter(e=>e.date>=w.start&&e.date<=w.end);if(wE.length===0)return{...w,days:0,totalC:0,avgC:'-',avgH:'-',avgB:'-'};const totalC=wE.reduce((s,e)=>s+e.c,0);return{...w,days:wE.length,totalC,avgC:(totalC/wE.length).toFixed(1),avgH:(wE.reduce((s,e)=>s+e.h,0)/wE.length).toFixed(1),avgB:(wE.reduce((s,e)=>s+e.b,0)/wE.length).toFixed(1)};});}

function getStaffMonthly(name,data){const entries=getStaffEntries(name,data);if(entries.length===0)return null;const totalC=entries.reduce((s,e)=>s+e.c,0);const remarks=entries.filter(e=>e.remark).map(e=>({date:e.date,text:e.remark}));const best=entries.reduce((a,b)=>b.c>a.c?b:a,entries[0]);return{days:entries.length,totalC,avgC:(totalC/entries.length).toFixed(1),avgH:(entries.reduce((s,e)=>s+e.h,0)/entries.length).toFixed(1),avgB:(entries.reduce((s,e)=>s+e.b,0)/entries.length).toFixed(1),remarks,bestDay:best};}

function getWeeklyOverview(data,weeks){return weeks.map(w=>{const rows=data.filter(r=>r.date>=w.start&&r.date<=w.end&&r.weather!=='惡劣天氣');if(rows.length===0)return{...w,avgC:0,avgH:0,avgB:0,fgT:0,fgR:0,pct:'0%'};let tC=0,tH=0,tB=0,cnt=0,fgT=0,fgR=0;rows.forEach(r=>{[1,2,3].forEach(i=>{if(r[`s${i}`]){tC+=r[`c${i}`]||0;tH+=r[`h${i}`]||0;tB+=r[`b${i}`]||0;cnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;});return{...w,avgC:cnt?(tC/cnt).toFixed(1):0,avgH:cnt?(tH/cnt).toFixed(1):0,avgB:cnt?(tB/cnt).toFixed(1):0,fgT,fgR,pct:fgT?(fgR/fgT*100).toFixed(1)+'%':'0%'};});}

function getWeatherStats(data){const stats={};data.forEach(r=>{if(!stats[r.weather])stats[r.weather]={days:0,fgTs:[],fgRs:[],hrs:[],brs:[]};stats[r.weather].days++;if(r.fgT)stats[r.weather].fgTs.push(r.fgT);if(r.fgR)stats[r.weather].fgRs.push(r.fgR);[1,2,3].forEach(i=>{if(r[`h${i}`])stats[r.weather].hrs.push(r[`h${i}`]);if(r[`b${i}`])stats[r.weather].brs.push(r[`b${i}`]);});});return Object.entries(stats).map(([w,d])=>({weather:w,days:d.days,avgFgT:d.fgTs.length?Math.round(d.fgTs.reduce((a,b)=>a+b,0)/d.fgTs.length):'-',avgFgR:d.fgRs.length?Math.round(d.fgRs.reduce((a,b)=>a+b,0)/d.fgRs.length):'-',avgH:d.hrs.length?(d.hrs.reduce((a,b)=>a+b,0)/d.hrs.length).toFixed(1):'-',avgB:d.brs.length?(d.brs.reduce((a,b)=>a+b,0)/d.brs.length).toFixed(1):'-',pct:d.fgTs.length?(d.fgRs.reduce((a,b)=>a+b,0)/d.fgTs.reduce((a,b)=>a+b,0)*100).toFixed(1)+'%':'-'}));}

function getICList(data){const s=new Set();data.forEach(r=>s.add(r.ic));return Array.from(s).sort();}

function getICStats(icName,data){const records=data.filter(r=>r.ic===icName);const workRecs=records.filter(r=>r.weather!=='惡劣天氣');let totalCap=0,rovStaffCnt=0,fgT=0,fgR=0,tH=0,tB=0;workRecs.forEach(r=>{[1,2,3].forEach(i=>{if(r[`s${i}`]){totalCap+=r[`c${i}`]||0;tH+=r[`h${i}`]||0;tB+=r[`b${i}`]||0;rovStaffCnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;});const totalHeadcount=rovStaffCnt+workRecs.length;return{totalDays:records.length,workDays:workRecs.length,cancelDays:records.length-workRecs.length,totalCap,rovStaffCnt,avgRovStaff:workRecs.length>0?(rovStaffCnt/workRecs.length).toFixed(1):'-',avgHeadcount:workRecs.length>0?(totalHeadcount/workRecs.length).toFixed(1):'-',avgCapPerStaff:rovStaffCnt>0?(totalCap/rovStaffCnt).toFixed(1):'-',avgCapPerDay:workRecs.length>0?(totalCap/workRecs.length).toFixed(1):'-',avgH:rovStaffCnt>0?(tH/rovStaffCnt).toFixed(1):'-',avgB:rovStaffCnt>0?(tB/rovStaffCnt).toFixed(1):'-',fgT,fgR,fgDailyAvg:workRecs.length>0?Math.round(fgT/workRecs.length):0,rovPct:fgT>0?(fgR/fgT*100).toFixed(1):0,rovPctStr:fgT>0?(fgR/fgT*100).toFixed(1)+'%':'-'};}

function rankICs(data){const icList=getICList(data);const statsArr=icList.map(ic=>({name:ic,...getICStats(ic,data)})).filter(s=>s.workDays>0);if(statsArr.length===0)return[];const maxCap=Math.max(...statsArr.map(s=>parseFloat(s.avgCapPerDay)||0));const maxFgD=Math.max(...statsArr.map(s=>s.fgDailyAvg||0));const maxRov=Math.max(...statsArr.map(s=>parseFloat(s.rovPct)||0));const maxH=Math.max(...statsArr.map(s=>parseFloat(s.avgH)||0));const maxB=Math.max(...statsArr.map(s=>parseFloat(s.avgB)||0));return statsArr.map(s=>{const sCapDay=maxCap>0?((parseFloat(s.avgCapPerDay)||0)/maxCap)*30:0;const sFgD=maxFgD>0?((s.fgDailyAvg||0)/maxFgD)*25:0;const sRov=maxRov>0?((parseFloat(s.rovPct)||0)/maxRov)*20:0;const sH=maxH>0?((parseFloat(s.avgH)||0)/maxH)*15:0;const sB=maxB>0?((parseFloat(s.avgB)||0)/maxB)*10:0;const score=sCapDay+sFgD+sRov+sH+sB;const breakdown={cap:Math.round(sCapDay*10)/10,fg:Math.round(sFgD*10)/10,rov:Math.round(sRov*10)/10,hit:Math.round(sH*10)/10,bring:Math.round(sB*10)/10};return{...s,score:Math.round(score*10)/10,breakdown};}).sort((a,b)=>b.score-a.score);}

function genICComment(ranked){if(!ranked||ranked.length===0)return'';const top=ranked[0];const parts=[`${top._sn} 整體表現最突出`];if(parseFloat(top.avgCapPerDay)>0)parts.push(`日均 Capture ${top.avgCapPerDay} 組`);if(top.fgDailyAvg>0)parts.push(`日均 FG $${top.fgDailyAvg.toLocaleString()}`);if(parseFloat(top.rovPct)>0)parts.push(`Roving 佔比 ${top.rovPctStr}`);let comment=parts.join('，');if(ranked.length>1){const last=ranked[ranked.length-1];const gap=(top.score-last.score).toFixed(1);comment+=`。與排尾 ${last._sn} 相差 ${gap} 分`;if(parseFloat(last.avgCapPerDay)<parseFloat(top.avgCapPerDay)*0.7){comment+=`，${last._sn} 日均 Capture 偏低（${last.avgCapPerDay}），建議跟進`;}}return comment+'。';}

function getStaffUnderIC(icName,data){const map={};data.filter(r=>r.ic===icName&&r.weather!=='惡劣天氣').forEach(r=>{[1,2,3].forEach(i=>{const n=r[`s${i}`];if(n){if(!map[n])map[n]={days:0,tC:0,tH:0,tB:0};map[n].days++;map[n].tC+=r[`c${i}`]||0;map[n].tH+=r[`h${i}`]||0;map[n].tB+=r[`b${i}`]||0;}});});return Object.entries(map).map(([n,d])=>({name:n,days:d.days,totalC:d.tC,avgC:(d.tC/d.days).toFixed(1),avgH:(d.tH/d.days).toFixed(1),avgB:(d.tB/d.days).toFixed(1)})).sort((a,b)=>b.totalC-a.totalC);}

function calcYearSummary(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];let totalCap=0,fgT=0,fgR=0,workDays=0,totalDays=0,staffCnt=0;months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.forEach(r=>{totalDays++;if(r.weather!=='惡劣天氣'){workDays++;[1,2,3].forEach(i=>{if(r[`s${i}`]){totalCap+=r[`c${i}`]||0;staffCnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;}});});return{totalCap,fgT,fgR,workDays,totalDays,avgCap:staffCnt>0?(totalCap/staffCnt).toFixed(1):'-',rovPct:fgT>0?(fgR/fgT*100).toFixed(1):'-',months:months.length};}

function getYearlyMonthly(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];return months.map(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];const wd=d.filter(r=>r.weather!=='惡劣天氣');let tC=0,cnt=0,fgT=0,fgR=0;wd.forEach(r=>{[1,2,3].forEach(i=>{if(r[`s${i}`]){tC+=r[`c${i}`]||0;cnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;});return{month:m,label:MONTHS_LABEL[m],totalDays:d.length,workDays:wd.length,totalCap:tC,avgCap:cnt>0?(tC/cnt).toFixed(1):'-',fgT,fgR,rovPct:fgT>0?(fgR/fgT*100).toFixed(1):'-'};});}

function getYearlyStaffRank(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];const map={};months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.filter(r=>r.weather!=='惡劣天氣').forEach(r=>{[1,2,3].forEach(i=>{const n=r[`s${i}`];if(n){if(!map[n])map[n]={days:0,tC:0,tH:0,tB:0,months:new Set()};map[n].days++;map[n].tC+=r[`c${i}`]||0;map[n].tH+=r[`h${i}`]||0;map[n].tB+=r[`b${i}`]||0;map[n].months.add(m);}});});});return Object.entries(map).map(([n,d])=>({name:n,days:d.days,totalC:d.tC,avgC:(d.tC/d.days).toFixed(1),avgH:(d.tH/d.days).toFixed(1),avgB:(d.tB/d.days).toFixed(1),mths:d.months.size})).sort((a,b)=>b.totalC-a.totalC);}

function getYearlyICRank(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];const map={};months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.forEach(r=>{const n=r.ic;if(!map[n])map[n]={days:0,workDays:0,tC:0,sCnt:0,fgT:0,fgR:0,tH:0,tB:0};map[n].days++;if(r.weather!=='惡劣天氣'){map[n].workDays++;[1,2,3].forEach(i=>{if(r[`s${i}`]){map[n].tC+=r[`c${i}`]||0;map[n].tH+=r[`h${i}`]||0;map[n].tB+=r[`b${i}`]||0;map[n].sCnt++;}});map[n].fgT+=r.fgT||0;map[n].fgR+=r.fgR||0;}});});return Object.entries(map).map(([n,d])=>{const totalHC=d.sCnt+d.workDays;return{name:n,days:d.days,workDays:d.workDays,totalCap:d.tC,avgHeadcount:d.workDays>0?(totalHC/d.workDays).toFixed(1):'-',avgCapPerStaff:d.sCnt>0?(d.tC/d.sCnt).toFixed(1):'-',avgCapPerDay:d.workDays>0?(d.tC/d.workDays).toFixed(1):'-',fgT:d.fgT,fgR:d.fgR,fgDailyAvg:d.workDays>0?Math.round(d.fgT/d.workDays):0,rovPct:d.fgT>0?(d.fgR/d.fgT*100).toFixed(1)+'%':'-'};}).sort((a,b)=>b.totalCap-a.totalCap);}

function TrendArrow({weekly,metric}){const vals=weekly.filter(w=>w[metric]!=='-').map(w=>parseFloat(w[metric]));if(vals.length<2)return null;const diff=vals[vals.length-1]-vals[vals.length-2];if(Math.abs(diff)<0.1)return <span className="text-gray-400 text-xs ml-1">→</span>;return diff>0?<span className="text-emerald-500 text-xs ml-1">▲</span>:<span className="text-rose-500 text-xs ml-1">▼</span>;}

const rankMedal=(i)=>i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
const rankBg=(i)=>i===0?'bg-yellow-50 border-yellow-200':i===1?'bg-gray-50 border-gray-200':i===2?'bg-orange-50 border-orange-200':'bg-white border-gray-100';

function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(<div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40" onClick={onClose}>
    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between mb-4"><div className="font-bold text-gray-800">{title}</div><button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button></div>
      {children}
    </div>
  </div>);
}

function Dashboard(){
  const [selYear,setSelYear]=useState(2026);
  const [selMonth,setSelMonth]=useState(8);
  const [tab,setTab]=useState(0);
  const [selStaff,setSelStaff]=useState('Chan Ivan');
  const [selIC,setSelIC]=useState('');
  const [yearlyYear,setYearlyYear]=useState(2026);
  const [showYoY,setShowYoY]=useState(false);
  const [icRoster,setIcRoster]=useState(INIT_IC_ROSTER);
  const [staffRoster,setStaffRoster]=useState(INIT_STAFF_ROSTER);
  const [showAddModal,setShowAddModal]=useState(null);
  const [newFull,setNewFull]=useState('');
  const [newNick,setNewNick]=useState('');
  const [toast,setToast]=useState('');
  const [confirmDel,setConfirmDel]=useState(null);

  const nextId=useMemo(()=>{const all=[...icRoster,...staffRoster];return all.length?Math.max(...all.map(r=>r.id))+1:1;},[icRoster,staffRoster]);
  const nicknameMap=useMemo(()=>{const m={};[...icRoster,...staffRoster].forEach(r=>{m[r.fullName]=r.nickname;});return m;},[icRoster,staffRoster]);
  const sn=(name)=>nicknameMap[name]||name.split(' ').pop();
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(''),2500);};

  const toggleActive=(type,id)=>{
    if(type==='ic'){setIcRoster(prev=>prev.map(r=>r.id===id?{...r,active:!r.active}:r));}
    else{setStaffRoster(prev=>prev.map(r=>r.id===id?{...r,active:!r.active}:r));}
  };

    if(!newFull.trim()||!newNick.trim()){showToast('⚠️ 請填寫全名同顯示名');return;}
    const roster=showAddModal==='ic'?icRoster:staffRoster;
    if(roster.some(r=>r.fullName.toLowerCase()===newFull.trim().toLowerCase())){showToast('⚠️ 呢個名已經存在');return;}
    const entry={id:nextId,fullName:newFull.trim(),nickname:newNick.trim(),active:true};
    if(showAddModal==='ic')setIcRoster(prev=>[...prev,entry]);
    else setStaffRoster(prev=>[...prev,entry]);
    showToast(`✅ 已新增 ${newNick.trim()}`);
    setNewFull('');setNewNick('');setShowAddModal(null);
  };

  const handleDelete=()=>{
    if(!confirmDel)return;
    if(confirmDel.type==='ic')setIcRoster(prev=>prev.filter(r=>r.id!==confirmDel.id));
    else setStaffRoster(prev=>prev.filter(r=>r.id!==confirmDel.id));
    showToast(`🗑️ 已刪除 ${confirmDel.name}`);
    setConfirmDel(null);
  };

  const activeICs=icRoster.filter(r=>r.active);
  const inactiveICs=icRoster.filter(r=>!r.active);
  const activeStaff=staffRoster.filter(r=>r.active);
  const inactiveStaff=staffRoster.filter(r=>!r.active);

  const dataKey=`${selYear}-${String(selMonth).padStart(2,'0')}`;

  const icList=useMemo(()=>getICList(data),[dataKey]);

  const activeIC=selIC&&icList.includes(selIC)?selIC:(icList[0]||'');

  const total=data.length;const workDays=data.filter(r=>r.weather!=='惡劣天氣').length;const totalFgT=data.filter(r=>r.fgT).reduce((a,r)=>a+r.fgT,0);const totalFgR=data.filter(r=>r.fgR).reduce((a,r)=>a+r.fgR,0);const totalCaptures=data.reduce((a,r)=>a+(r.c1||0)+(r.c2||0)+(r.c3||0),0);

  const staffBarData=staffList.slice(0,6).map(n=>{const e=getStaffEntries(n,data);return{name:sn(n),Captures:e.reduce((s,x)=>s+x.c,0)};});
  const weeklyChart=staffWeekly.filter(w=>w.days>0).map(w=>({name:w.key,'日均Cap':parseFloat(w.avgC),'Hit':parseFloat(w.avgH),'帶返去':parseFloat(w.avgB)}));

  const handleYearChange=(e)=>{const y=Number(e.target.value);setSelYear(y);const ms=AVAILABLE_MONTHS_BY_YEAR[y]||[];if(!ms.includes(selMonth)&&ms.length)setSelMonth(ms[ms.length-1]);};
  const wIcon=(w)=>w==='晴天'?'☀️':w==='間歇落雨'?'🌦️':'⛈️';

  const radarData=rankedICs.length>0?[
    {dim:'日均Cap（30%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.cap]))},
    {dim:'日均FG（25%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.fg]))},
    {dim:'Roving%（20%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.rov]))},
    {dim:'Hit率（15%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.hit]))},
    {dim:'帶返去（10%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.bring]))},
  ]:[];
  const radarColors=['#6366f1','#f59e0b','#10b981','#ef4444','#3b82f6'];

  const yoyMonthlyData=useMemo(()=>{if(!hasPrevYear)return[];const allMonths=new Set();yearlyMonthly.forEach(m=>allMonths.add(m.month));prevYearlyMonthly.forEach(m=>allMonths.add(m.month));return Array.from(allMonths).sort((a,b)=>a-b).map(m=>{const cur=yearlyMonthly.find(x=>x.month===m);const prev=prevYearlyMonthly.find(x=>x.month===m);return{month:m,label:MONTHS_LABEL[m],cur,prev};});},[yearlyYear]);
  const yoyChartCap=yoyMonthlyData.filter(d=>d.cur||d.prev).map(d=>({name:d.label,[yearlyYear]:d.cur?.totalCap||0,[prevYear]:d.prev?.totalCap||0}));
  const yoyChartFg=yoyMonthlyData.filter(d=>d.cur||d.prev).map(d=>({name:d.label,[yearlyYear]:d.cur?.fgT||0,[prevYear]:d.prev?.fgT||0}));

  const RosterTable=({type,roster,activeList,inactiveList})=>(
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-3">
          <span className="text-sm font-bold text-gray-700">{type==='ic'?'🧑‍💼 IC 名單':'👤 Roving 同事名單'}</span>
          <span className="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-lg">{activeList.length} 啟用</span>

        <button onClick={()=>{setShowAddModal(type);setNewFull('');setNewNick('');}} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-indigo-700 transition-all shadow-sm">＋ 新增{type==='ic'?'IC':'同事'}</button>
      </div>
      <div className="bg-gray-50 rounded-xl p-3 border border-gray-100">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-gray-200">
            <th className="text-left p-2 text-xs font-semibold text-gray-500">全名</th>
            <th className="text-left p-2 text-xs font-semibold text-gray-500">顯示名</th>
            <th className="text-center p-2 text-xs font-semibold text-gray-500">Form 狀態</th>
            <th className="text-center p-2 text-xs font-semibold text-gray-500">歷史數據</th>
            <th className="text-center p-2 text-xs font-semibold text-gray-500">操作</th>
          </tr></thead>
          <tbody>
            {roster.map(r=>{
              const hasHistory=type==='ic'
                ? Object.values(ALL_DATA).some(arr=>arr.some(d=>d.ic===r.fullName))

              return(
                <tr key={r.id} className={`border-b border-gray-100 transition-all ${r.active?'':'bg-gray-100 opacity-60'}`}>
                  <td className="p-2 font-medium text-gray-700 text-xs">{r.fullName}</td>
                  <td className="p-2"><span className={`px-2 py-0.5 rounded-lg text-xs font-bold ${r.active?'bg-indigo-100 text-indigo-700':'bg-gray-200 text-gray-500'}`}>{r.nickname}</span></td>
                  <td className="p-2 text-center">
                    <button onClick={()=>toggleActive(type,r.id)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${r.active?'bg-emerald-500':'bg-gray-300'}`}>
                      <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow-sm ${r.active?'translate-x-6':'translate-x-1'}`}/>
                    </button>
                  </td>
                  <td className="p-2 text-center">
                    {hasHistory?<span className="text-xs text-amber-600 font-medium">📊 有記錄</span>:<span className="text-xs text-gray-300">—</span>}
                  </td>
                  <td className="p-2 text-center">
                    {hasHistory?(

              <tbody>{rankedICs.map((s,i)=>(<tr key={s.name} className={`border-b border-gray-50 hover:bg-gray-50 cursor-pointer ${activeIC===s.name?'bg-purple-50':''}`} onClick={()=>setSelIC(s.name)}><td className="p-3 text-center text-lg">{rankMedal(i)}</td><td className="p-3 font-semibold text-gray-700 text-xs whitespace-nowrap">{activeIC===s.name&&<span className="text-purple-500 mr-1">●</span>}{sn(s.name)}</td><td className="p-3 text-center"><span className={`px-2 py-1 rounded-lg text-xs font-black ${i===0?'bg-yellow-100 text-yellow-700':i===1?'bg-gray-100 text-gray-600':i===2?'bg-orange-100 text-orange-600':'bg-gray-50 text-gray-500'}`}>{s.score}</span></td><td className="p-3 text-center">{s.workDays}{s.cancelDays>0&&<span className="text-xs text-rose-400 ml-1">({s.cancelDays}取消)</span>}</td><td className="p-3 text-center"><span className="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-lg text-xs font-bold">{s.avgHeadcount}</span></td><td className="p-3 text-center font-bold text-indigo-600">{s.totalCap}</td><td className="p-3 text-center font-bold text-amber-600">{s.avgCapPerDay}</td><td className="p-3 text-center font-semibold text-gray-600">{s.avgCapPerStaff}</td><td className="p-3 text-center">${s.fgT.toLocaleString()}</td><td className="p-3 text-center font-semibold text-blue-600">${s.fgDailyAvg.toLocaleString()}</td><td className="p-3 text-center text-emerald-600 font-semibold">${s.fgR.toLocaleString()}</td><td className="p-3 text-center"><span className={`px-2 py-1 rounded-lg text-xs font-bold ${parseFloat(s.rovPctStr)>=55?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}`}>{s.rovPctStr}</span></td></tr>))}</tbody></table></div>

            {icStats&&(<>

digo-600 whitespace-nowrap">{r.s3?sn(r.s3):''}</td><td className="p-2 text-center font-bold">{r.c3||''}</td><td className="p-2 text-center">{r.fgT?`$${r.fgT.toLocaleString()}`:''}</td><td className="p-2 text-center text-emerald-600 font-semibold">{r.fgR?`$${r.fgR.toLocaleString()}`:''}</td><td className="p-2 text-center"><span className={pct?'bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-bold':''}>{pct}</span></td></tr>);})}</tbody></table></div></div>

        )}

        {hasData&&tab===6&&(
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="flex items-center justify-between mb-4"><div className="font-bold text-gray-700 text-sm">📋 Responses 原始數據（{selYear}/{MONTHS_LABEL[selMonth]}）</div></div><div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="bg-gray-50">{['日期','天氣','IC','同事1','C1','H1','B1','同事2','C2','H2','B2','同事3','C3','H3','B3','FG總','Rov','%'].map((h,i)=>(<th key={i} className="p-2 font-semibold text-gray-500 whitespace-nowrap text-left">{h}</th>))}</tr></thead><tbody>{data.map((r,i)=>{const pct=r.fgT&&r.fgR?(r.fgR/r.fgT*100).toFixed(1)+'%':'';return(<tr key={i} className={`border-b border-gray-50 ${r.weather==='惡劣天氣'?'bg-amber-50':'hover:bg-gray-50'}`}><td className="p-2 whitespace-nowrap font-medium">{r.date.slice(5)}</td><td className="p-2">{wIcon(r.weather)}</td><td className="p-2 whitespace-nowrap">{sn(r.ic)}</td><td className="p-2 whitespace-nowrap text-indigo-600">{r.s1?sn(r.s1):''}</td><td className="p-2 font-bold">{r.c1||''}</td><td className="p-2">{r.h1?<Stars val={r.h1}/>:''}</td><td className="p-2">{r.b1?<Stars val={r.b1}/>:''}</td><td className="p-2 whitespace-nowrap text-indigo-600">{r.s2?sn(r.s2):''}</td><td className="p-2 font-bold">{r.c2||''}</td><td className="p-2">{r.h2?<Stars val={r.h2}/>:''}</td><td className="p-2">{r.b2?<Stars val={r.b2}/>:''}</td><td className="p-2 whitespace-nowrap text-indigo-600">{r.s3?sn(r.s3):''}</td><td className="p-2 font-bold">{r.c3||''}</td><td className="p-2">{r.h3?<Stars val={r.h3}/>:''}</td><td className="p-2">{r.b3?<Stars val={r.b3}/>:''}</td><td className="p-2">{r.fgT?`$${r.fgT.toLocaleString()}`:''}</td><td className="p-2 text-emerald-600 font-semibold">{r.fgR?`$${r.fgR.toLocaleString()}`:''}</td><td className="p-2"><span className={pct?'bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-bold':''}>{pct}</span></td></tr>);})}</tbody></table></div></div>
        )}

        {tab===7&&(
          <div className="space-y-6">
            <div className="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-6 text-white relative overflow-hidden">
              <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-y-8 translate-x-8"/>
              <div className="relative"><div className="text-xl font-bold mb-1">⚙️ 人員管理設定</div><div className="text-sm text-gray-300">加減 IC 同 Roving 同事 → 即時更新 Form 嘅選項</div></div>
            </div>
            <div className="bg-blue-50 rounded-2xl p-5 border border-blue-100">
              <div className="font-bold text-blue-700 text-sm mb-3">💡 點樣運作？</div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">🟢</div><div className="font-bold text-gray-700 text-sm mb-1">啟用 = Form 見到</div><div className="text-xs text-gray-400">撥去「啟用」嘅人會出現喺 IC 日報 Form 嘅下拉選項</div></div>
                <div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">⚪</div><div className="font-bold text-gray-700 text-sm mb-1">停用 = Form 無左</div><div className="text-xs text-gray-400">撥去「停用」就唔會再喺 Form 出現，但歷史數據唔受影響</div></div>
                <div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">🗑️</div><div className="font-bold text-gray-700 text-sm mb-1">刪除 = 完全移除</div><div className="text-xs text-gray-400">只有無歷史記錄嘅人先可以刪除，有記錄嘅只可以停用</div></div>
              </div>
            </div>
            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><RosterTable type="ic" roster={icRoster} activeList={activeICs} inactiveList={inactiveICs}/></div>
            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><RosterTable type="staff" roster={staffRoster} activeList={activeStaff} inactiveList={inactiveStaff}/></div>
            <div className="bg-gradient-to-br from-emerald-50 to-green-50 rounded-2xl p-5 border border-emerald-200">
              <div className="font-bold text-emerald-700 text-sm mb-4">👁️ Form 預覽 — IC 填表時會見到嘅選項</div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white rounded-xl p-4 border border-emerald-100"><div className="text-xs font-bold text-gray-500 mb-3 flex items-center gap-2"><span className="w-2 h-2 bg-purple-500 rounded-full"/>IC 當值人員（下拉選項）</div><div className="space-y-1">{activeICs.length>0?activeICs.map(r=>(<div key={r.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2"><span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"/><span className="text-sm text-gray-700">{r.fullName}</span><span className="text-xs text-gray-400 ml-auto">({r.nickname})</span></div>)):<div className="text-xs text-gray-300 text-center py-4">⚠️ 未有啟用嘅 IC</div>}</div>{inactiveICs.length>0&&<div className="mt-2 text-xs text-gray-400">已停用：{inactiveICs.map(r=>r.nickname).join('、')}</div>}</div>
                <div className="bg-white rounded-xl p-4 border border-emerald-100"><div className="text-xs font-bold text-gray-500 mb-3 flex items-center gap-2"><span className="w-2 h-2 bg-indigo-500 rounded-full"/>Roving 同事（下拉選項）</div><div className="space-y-1">{activeStaff.length>0?activeStaff.map(r=>(<div key={r.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2"><span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"/><span className="text-sm text-gray-700">{r.fullName}</span><span className="text-xs text-gray-400 ml-auto">({r.nickname})</span></div>)):<div className="text-xs text-gray-300 text-center py-4">⚠️ 未有啟用嘅同事</div>}</div>{inactiveStaff.length>0&&<div className="mt-2 text-xs text-gray-400">已停用：{inactiveStaff.map(r=>r.nickname).join('、')}</div>}</div>
              </div>
            </div>
          </div>
        )}

        <Modal open={!!showAddModal} onClose={()=>setShowAddModal(null)} title={`新增${showAddModal==='ic'?'IC':'Roving 同事'}`}>
          <div className="space-y-4">
            <div><label className="block text-xs font-bold text-gray-500 mb-1.5">全名（用於 Form 選項）</label><input value={newFull} onChange={e=>setNewFull(e.target.value)} placeholder="例如：Wong Tai Man Peter" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/><div className="text-xs text-gray-300 mt-1">格式：姓 名 英文名</div></div>
            <div><label className="block text-xs font-bold text-gray-500 mb-1.5">顯示名（Dashboard 顯示）</label><input value={newNick} onChange={e=>setNewNick(e.target.value)} placeholder="例如：Peter" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div className="flex gap-3 pt-2"><button onClick={()=>setShowAddModal(null)} className="flex-1 bg-gray-100 text-gray-500 font-semibold py-3 rounded-xl hover:bg-gray-200 text-sm">取消</button><button onClick={handleAdd} className="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 shadow-md text-sm">✅ 確認新增</button></div>
          </div>
        </Modal>

        <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="確認刪除">
          <div className="space-y-4">
            <div className="bg-rose-50 rounded-xl p-4 border border-rose-100 text-center"><div className="text-3xl mb-2">🗑️</div><div className="text-sm text-gray-700">確定要刪除 <span className="font-bold text-rose-600">{confirmDel?.name}</span> ？</div><div className="text-xs text-gray-400 mt-1">刪除後無法復原</div></div>
            <div className="flex gap-3"><button onClick={()=>setConfirmDel(null)} className="flex-1 bg-gray-100 text-gray-500 font-semibold py-3 rounded-xl hover:bg-gray-200 text-sm">取消</button><button onClick={handleDelete} className="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl hover:bg-rose-600 shadow-md text-sm">確認刪除</button></div>
          </div>
        </Modal>

        <div className="text-center text-xs text-gray-300 mt-8 pb-4">⬆️ Sample Data · 實際數據由 Form 自動生成</div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>
</body>
</html>
