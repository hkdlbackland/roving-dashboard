const{useState,useMemo,useEffect,useCallback}=React;
const{BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,PieChart,Pie,Cell,LineChart,Line,Legend,RadarChart,Radar,PolarGrid,PolarAngleAxis,PolarRadiusAxis}=Recharts;

// ═══════════════════════════════════════
// 🔄 DATA TRANSFORMATION
// ═══════════════════════════════════════
function parseDate(val){if(!val)return'';const s=String(val);if(s.includes('T'))return s.split('T')[0];if(s.includes('/')){const p=s.split('/');if(p.length===3&&p[2].length===4)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');if(p.length===3&&p[0].length===4)return p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0');}if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;try{const d=new Date(s);if(!isNaN(d))return d.toISOString().split('T')[0];}catch(e){}return s;}

function transformResponses(rows){
  if(!rows||!Array.isArray(rows))return[];
  const dayMap={};
  rows.forEach(row=>{
    const dateStr=parseDate(row.date);
    if(!dateStr||dateStr.length<8)return;
    if(!dayMap[dateStr]){
      dayMap[dateStr]={date:dateStr,weather:String(row.weather||'晴天'),ic:String(row.ic||''),fgT:0,fgR:0,staff:[]};
    }
    const fgT=Number(row.fgTotal),fgR=Number(row.fgRoving);
    if(!isNaN(fgT)&&fgT>0&&!dayMap[dateStr].fgT)dayMap[dateStr].fgT=fgT;
    if(!isNaN(fgR)&&fgR>0&&!dayMap[dateStr].fgR)dayMap[dateStr].fgR=fgR;
    const name=String(row.name||'').trim();
    if(name){
      dayMap[dateStr].staff.push({name,c:Number(row.captures)||0,h:Number(row.hitRate)||0,b:Number(row.bringBack)||0,r:String(row.remark||'').trim()});
    }
  });
  return Object.values(dayMap).map(day=>({date:day.date,weather:day.weather,ic:day.ic,fgT:day.fgT,fgR:day.fgR,staff:day.staff})).sort((a,b)=>a.date.localeCompare(b.date));
}

function buildDataStructures(records){
  const grouped={},mby={};
  records.forEach(rec=>{const p=rec.date.split('-');if(p.length<2)return;const key=p[0]+'-'+p[1],y=parseInt(p[0]),m=parseInt(p[1]);if(!grouped[key])grouped[key]=[];grouped[key].push(rec);if(!mby[y])mby[y]=new Set();mby[y].add(m);});
  Object.keys(mby).forEach(y=>{mby[y]=Array.from(mby[y]).sort((a,b)=>a-b);});
  return{grouped,mby,years:Object.keys(mby).map(Number).sort()};
}

// ═══════════════════════════════════════
// 📋 GLOBAL DATA
// ═══════════════════════════════════════
let ALL_DATA={};
let AVAILABLE_MONTHS_BY_YEAR={};
let AVAILABLE_YEARS=[];

const MONTHS_LABEL=['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const TABS=['📊 總覽','👤 同事','🧑‍💼 IC','📅 每週','🌦️ 天氣','📆 年度','📋 數據','⚙️ 設定'];
const pieColors=['#6366f1','#a78bfa','#c4b5fd','#f59e0b','#10b981','#ef4444','#3b82f6'];

// ═══════════════════════════════════════
// 🔧 HELPER FUNCTIONS
// ═══════════════════════════════════════
function Stars({val}){if(!val)return<span className="text-gray-300 text-xs">—</span>;return(<span className="inline-flex gap-0.5">{[1,2,3,4,5].map(i=>(<span key={i} className={`text-sm ${i<=val?'text-yellow-400':'text-gray-200'}`}>★</span>))}</span>);}

function StatCard({icon,label,value,sub,color='indigo'}){const bg={indigo:'bg-indigo-50 border-indigo-100',green:'bg-emerald-50 border-emerald-100',amber:'bg-amber-50 border-amber-100',blue:'bg-blue-50 border-blue-100',rose:'bg-rose-50 border-rose-100',purple:'bg-purple-50 border-purple-100'};const txt={indigo:'text-indigo-600',green:'text-emerald-600',amber:'text-amber-600',blue:'text-blue-600',rose:'text-rose-600',purple:'text-purple-600'};return(<div className={`${bg[color]} border rounded-2xl p-4 flex flex-col`}><div className="text-2xl mb-1">{icon}</div><div className="text-xs text-gray-400 font-medium mb-1">{label}</div><div className={`text-2xl font-bold ${txt[color]}`}>{value}</div>{sub&&<div className="text-xs text-gray-400 mt-1">{sub}</div>}</div>);}

function YoYBadge({cur,prev}){const c=parseFloat(cur),p=parseFloat(prev);if(isNaN(c)||isNaN(p)||p===0)return<span className="text-gray-300 text-xs">—</span>;const pct=((c-p)/Math.abs(p)*100).toFixed(1);const up=parseFloat(pct)>0;if(Math.abs(parseFloat(pct))<0.5)return<span className="text-gray-400 text-xs font-medium">→ 0%</span>;return<span className={`text-xs font-bold ${up?'text-emerald-600':'text-rose-500'}`}>{up?'▲':'▼'} {Math.abs(parseFloat(pct))}%</span>;}

function Modal({open,onClose,title,children}){if(!open)return null;return(<div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40" onClick={onClose}><div className="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between mb-4"><div className="font-bold text-gray-800">{title}</div><button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button></div>{children}</div></div>);}

function TrendArrow({weekly,metric}){const vals=weekly.filter(w=>w[metric]!=='-').map(w=>parseFloat(w[metric]));if(vals.length<2)return null;const diff=vals[vals.length-1]-vals[vals.length-2];if(Math.abs(diff)<0.1)return<span className="text-gray-400 text-xs ml-1">→</span>;return diff>0?<span className="text-emerald-500 text-xs ml-1">▲</span>:<span className="text-rose-500 text-xs ml-1">▼</span>;}

const rankMedal=(i)=>i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
const rankBg=(i)=>i===0?'bg-yellow-50 border-yellow-200':i===1?'bg-gray-50 border-gray-200':i===2?'bg-orange-50 border-orange-200':'bg-white border-gray-100';

function getWeeksForMonth(y,m){const ld=new Date(y,m,0).getDate();return[[1,7],[8,14],[15,21],[22,ld]].map(([s,e],i)=>{const sm=String(m).padStart(2,'0');return{key:`W${i+1}`,label:`W${i+1}（${m}/${s}–${m}/${e}）`,start:`${y}-${sm}-${String(s).padStart(2,'0')}`,end:`${y}-${sm}-${String(e).padStart(2,'0')}`};});}

function getStaffEntries(name,data){const e=[];data.forEach(r=>{r.staff.forEach(s=>{if(s.name===name)e.push({date:r.date,weather:r.weather,c:s.c,h:s.h,b:s.b,remark:s.r});});});return e;}

function getStaffList(data){const s=new Set();data.forEach(r=>{r.staff.forEach(st=>{s.add(st.name);});});return Array.from(s).sort((a,b)=>{const ea=getStaffEntries(a,data),eb=getStaffEntries(b,data);return eb.reduce((s,e)=>s+e.c,0)-ea.reduce((s,e)=>s+e.c,0);});}

function getStaffWeekly(name,data,weeks){const entries=getStaffEntries(name,data);return weeks.map(w=>{const wE=entries.filter(e=>e.date>=w.start&&e.date<=w.end);if(wE.length===0)return{...w,days:0,totalC:0,avgC:'-',avgH:'-',avgB:'-'};const totalC=wE.reduce((s,e)=>s+e.c,0);const hE=wE.filter(e=>e.h>0),bE=wE.filter(e=>e.b>0);return{...w,days:wE.length,totalC,avgC:(totalC/wE.length).toFixed(1),avgH:hE.length>0?(hE.reduce((s,e)=>s+e.h,0)/hE.length).toFixed(1):'-',avgB:bE.length>0?(bE.reduce((s,e)=>s+e.b,0)/bE.length).toFixed(1):'-'};});}

function getStaffMonthly(name,data){const entries=getStaffEntries(name,data);if(entries.length===0)return null;const totalC=entries.reduce((s,e)=>s+e.c,0);const hE=entries.filter(e=>e.h>0),bE=entries.filter(e=>e.b>0);const remarks=entries.filter(e=>e.remark).map(e=>({date:e.date,text:e.remark}));const best=entries.reduce((a,b)=>b.c>a.c?b:a,entries[0]);return{days:entries.length,totalC,avgC:(totalC/entries.length).toFixed(1),avgH:hE.length>0?(hE.reduce((s,e)=>s+e.h,0)/hE.length).toFixed(1):'-',avgB:bE.length>0?(bE.reduce((s,e)=>s+e.b,0)/bE.length).toFixed(1):'-',remarks,bestDay:best};}

function getWeeklyOverview(data,weeks){return weeks.map(w=>{const rows=data.filter(r=>r.date>=w.start&&r.date<=w.end&&r.weather!=='惡劣天氣');if(rows.length===0)return{...w,avgC:0,avgH:0,avgB:0,fgT:0,fgR:0,pct:'0%'};let tC=0,tH=0,tB=0,cnt=0,hCnt=0,bCnt=0,fgT=0,fgR=0;rows.forEach(r=>{r.staff.forEach(s=>{tC+=s.c||0;cnt++;if(s.h>0){tH+=s.h;hCnt++;}if(s.b>0){tB+=s.b;bCnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;});return{...w,avgC:cnt?(tC/cnt).toFixed(1):0,avgH:hCnt?(tH/hCnt).toFixed(1):0,avgB:bCnt?(tB/bCnt).toFixed(1):0,fgT,fgR,pct:fgT?(fgR/fgT*100).toFixed(1)+'%':'0%'};});}

function getWeatherStats(data){const stats={};data.forEach(r=>{if(!stats[r.weather])stats[r.weather]={days:0,fgTs:[],fgRs:[],hrs:[],brs:[]};stats[r.weather].days++;if(r.fgT)stats[r.weather].fgTs.push(r.fgT);if(r.fgR)stats[r.weather].fgRs.push(r.fgR);r.staff.forEach(s=>{if(s.h>0)stats[r.weather].hrs.push(s.h);if(s.b>0)stats[r.weather].brs.push(s.b);});});return Object.entries(stats).map(([w,d])=>({weather:w,days:d.days,avgFgT:d.fgTs.length?Math.round(d.fgTs.reduce((a,b)=>a+b,0)/d.fgTs.length):'-',avgFgR:d.fgRs.length?Math.round(d.fgRs.reduce((a,b)=>a+b,0)/d.fgRs.length):'-',avgH:d.hrs.length?(d.hrs.reduce((a,b)=>a+b,0)/d.hrs.length).toFixed(1):'-',avgB:d.brs.length?(d.brs.reduce((a,b)=>a+b,0)/d.brs.length).toFixed(1):'-',pct:d.fgTs.length?(d.fgRs.reduce((a,b)=>a+b,0)/d.fgTs.reduce((a,b)=>a+b,0)*100).toFixed(1)+'%':'-'}));}

function getICList(data){const s=new Set();data.forEach(r=>s.add(r.ic));return Array.from(s).sort();}

function getICStats(icName,data){const records=data.filter(r=>r.ic===icName);const workRecs=records.filter(r=>r.weather!=='惡劣天氣');let totalCap=0,rovStaffCnt=0,fgT=0,fgR=0,tH=0,tB=0,hCnt=0,bCnt=0;workRecs.forEach(r=>{r.staff.forEach(s=>{totalCap+=s.c||0;rovStaffCnt++;if(s.h>0){tH+=s.h;hCnt++;}if(s.b>0){tB+=s.b;bCnt++;}});fgT+=r.fgT||0;fgR+=r.fgR||0;});const totalHeadcount=rovStaffCnt+workRecs.length;return{totalDays:records.length,workDays:workRecs.length,cancelDays:records.length-workRecs.length,totalCap,rovStaffCnt,avgRovStaff:workRecs.length>0?(rovStaffCnt/workRecs.length).toFixed(1):'-',avgHeadcount:workRecs.length>0?(totalHeadcount/workRecs.length).toFixed(1):'-',avgCapPerStaff:rovStaffCnt>0?(totalCap/rovStaffCnt).toFixed(1):'-',avgCapPerDay:workRecs.length>0?(totalCap/workRecs.length).toFixed(1):'-',avgH:hCnt>0?(tH/hCnt).toFixed(1):'-',avgB:bCnt>0?(tB/bCnt).toFixed(1):'-',fgT,fgR,fgDailyAvg:workRecs.length>0?Math.round(fgT/workRecs.length):0,rovPct:fgT>0?(fgR/fgT*100).toFixed(1):0,rovPctStr:fgT>0?(fgR/fgT*100).toFixed(1)+'%':'-'};}

function rankICs(data){const icList=getICList(data);const statsArr=icList.map(ic=>({name:ic,...getICStats(ic,data)})).filter(s=>s.workDays>0);if(statsArr.length===0)return[];const maxCap=Math.max(...statsArr.map(s=>parseFloat(s.avgCapPerDay)||0));const maxFgD=Math.max(...statsArr.map(s=>s.fgDailyAvg||0));const maxRov=Math.max(...statsArr.map(s=>parseFloat(s.rovPct)||0));const maxH=Math.max(...statsArr.map(s=>parseFloat(s.avgH)||0));const maxB=Math.max(...statsArr.map(s=>parseFloat(s.avgB)||0));return statsArr.map(s=>{const sCapDay=maxCap>0?((parseFloat(s.avgCapPerDay)||0)/maxCap)*30:0;const sFgD=maxFgD>0?((s.fgDailyAvg||0)/maxFgD)*25:0;const sRov=maxRov>0?((parseFloat(s.rovPct)||0)/maxRov)*20:0;const sH=maxH>0?((parseFloat(s.avgH)||0)/maxH)*15:0;const sB=maxB>0?((parseFloat(s.avgB)||0)/maxB)*10:0;const score=sCapDay+sFgD+sRov+sH+sB;return{...s,score:Math.round(score*10)/10,breakdown:{cap:Math.round(sCapDay*10)/10,fg:Math.round(sFgD*10)/10,rov:Math.round(sRov*10)/10,hit:Math.round(sH*10)/10,bring:Math.round(sB*10)/10}};}).sort((a,b)=>b.score-a.score);}

function genICComment(ranked){if(!ranked||ranked.length===0)return'';const top=ranked[0];const parts=[`${top._sn} 整體表現最突出`];if(parseFloat(top.avgCapPerDay)>0)parts.push(`日均 Capture ${top.avgCapPerDay} 組`);if(top.fgDailyAvg>0)parts.push(`日均 FG $${top.fgDailyAvg.toLocaleString()}`);if(parseFloat(top.rovPct)>0)parts.push(`Roving 佔比 ${top.rovPctStr}`);let comment=parts.join('，');if(ranked.length>1){const last=ranked[ranked.length-1];const gap=(top.score-last.score).toFixed(1);comment+=`。與排尾 ${last._sn} 相差 ${gap} 分`;if(parseFloat(last.avgCapPerDay)<parseFloat(top.avgCapPerDay)*0.7){comment+=`，${last._sn} 日均 Capture 偏低（${last.avgCapPerDay}），建議跟進`;}}return comment+'。';}

function getStaffUnderIC(icName,data){const map={};data.filter(r=>r.ic===icName&&r.weather!=='惡劣天氣').forEach(r=>{r.staff.forEach(s=>{const n=s.name;if(!map[n])map[n]={days:0,tC:0,tH:0,tB:0,hCnt:0,bCnt:0};map[n].days++;map[n].tC+=s.c||0;if(s.h>0){map[n].tH+=s.h;map[n].hCnt++;}if(s.b>0){map[n].tB+=s.b;map[n].bCnt++;}});});return Object.entries(map).map(([n,d])=>({name:n,days:d.days,totalC:d.tC,avgC:(d.tC/d.days).toFixed(1),avgH:d.hCnt>0?(d.tH/d.hCnt).toFixed(1):'-',avgB:d.bCnt>0?(d.tB/d.bCnt).toFixed(1):'-'})).sort((a,b)=>b.totalC-a.totalC);}

function calcYearSummary(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];let totalCap=0,fgT=0,fgR=0,workDays=0,totalDays=0,staffCnt=0;months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.forEach(r=>{totalDays++;if(r.weather!=='惡劣天氣'){workDays++;r.staff.forEach(s=>{totalCap+=s.c||0;staffCnt++;});fgT+=r.fgT||0;fgR+=r.fgR||0;}});});return{totalCap,fgT,fgR,workDays,totalDays,avgCap:staffCnt>0?(totalCap/staffCnt).toFixed(1):'-',rovPct:fgT>0?(fgR/fgT*100).toFixed(1):'-',months:months.length};}

function getYearlyMonthly(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];return months.map(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];const wd=d.filter(r=>r.weather!=='惡劣天氣');let tC=0,cnt=0,fgT=0,fgR=0;wd.forEach(r=>{r.staff.forEach(s=>{tC+=s.c||0;cnt++;});fgT+=r.fgT||0;fgR+=r.fgR||0;});return{month:m,label:MONTHS_LABEL[m],totalDays:d.length,workDays:wd.length,totalCap:tC,avgCap:cnt>0?(tC/cnt).toFixed(1):'-',fgT,fgR,rovPct:fgT>0?(fgR/fgT*100).toFixed(1):'-'};});}

function getYearlyStaffRank(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];const map={};months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.filter(r=>r.weather!=='惡劣天氣').forEach(r=>{r.staff.forEach(s=>{const n=s.name;if(!map[n])map[n]={days:0,tC:0,tH:0,tB:0,hCnt:0,bCnt:0,months:new Set()};map[n].days++;map[n].tC+=s.c||0;if(s.h>0){map[n].tH+=s.h;map[n].hCnt++;}if(s.b>0){map[n].tB+=s.b;map[n].bCnt++;}map[n].months.add(m);});});});return Object.entries(map).map(([n,d])=>({name:n,days:d.days,totalC:d.tC,avgC:(d.tC/d.days).toFixed(1),avgH:d.hCnt>0?(d.tH/d.hCnt).toFixed(1):'-',avgB:d.bCnt>0?(d.tB/d.bCnt).toFixed(1):'-',mths:d.months.size})).sort((a,b)=>b.totalC-a.totalC);}

function getYearlyICRank(year){const months=AVAILABLE_MONTHS_BY_YEAR[year]||[];const map={};months.forEach(m=>{const key=`${year}-${String(m).padStart(2,'0')}`;const d=ALL_DATA[key]||[];d.forEach(r=>{const n=r.ic;if(!map[n])map[n]={days:0,workDays:0,tC:0,sCnt:0,fgT:0,fgR:0};map[n].days++;if(r.weather!=='惡劣天氣'){map[n].workDays++;r.staff.forEach(s=>{map[n].tC+=s.c||0;map[n].sCnt++;});map[n].fgT+=r.fgT||0;map[n].fgR+=r.fgR||0;}});});return Object.entries(map).map(([n,d])=>{const totalHC=d.sCnt+d.workDays;return{name:n,days:d.days,workDays:d.workDays,totalCap:d.tC,avgHeadcount:d.workDays>0?(totalHC/d.workDays).toFixed(1):'-',avgCapPerStaff:d.sCnt>0?(d.tC/d.sCnt).toFixed(1):'-',avgCapPerDay:d.workDays>0?(d.tC/d.workDays).toFixed(1):'-',fgT:d.fgT,fgR:d.fgR,fgDailyAvg:d.workDays>0?Math.round(d.fgT/d.workDays):0,rovPct:d.fgT>0?(d.fgR/d.fgT*100).toFixed(1)+'%':'-'};}).sort((a,b)=>b.totalCap-a.totalCap);}

// ═══════════════════════════════════════
// 🚀 DASHBOARD WRAPPER (fetches data)
// ═══════════════════════════════════════
function Dashboard(){
  const[ready,setReady]=useState(false);
  const[err,setErr]=useState('');
  const[loadedRosters,setLoadedRosters]=useState(null);
  const[rawResponses,setRawResponses]=useState([]);

  useEffect(()=>{
    Promise.all([
      fetch(APPS_SCRIPT_URL+'?action=getResponses').then(r=>r.json()),
      fetch(APPS_SCRIPT_URL+'?action=getAllRosters').then(r=>r.json())
    ]).then(([respRes,rosterRes])=>{
      const ics=(rosterRes.data?.ics||[]).map((r,i)=>({id:i+1,fullName:r.fullName,nickname:r.nickname,active:r.active===true||r.active==='TRUE'}));
      const staff=(rosterRes.data?.staff||[]).map((r,i)=>({id:1000+i,fullName:r.fullName,nickname:r.nickname,active:r.active===true||r.active==='TRUE'}));
      setLoadedRosters({ics,staff});

      const rows=respRes.data||[];
      setRawResponses(rows);
      if(rows.length===0){
        ALL_DATA={};AVAILABLE_MONTHS_BY_YEAR={};AVAILABLE_YEARS=[];
      }else{
        const records=transformResponses(rows);
        const{grouped,mby,years}=buildDataStructures(records);
        ALL_DATA=grouped;
        AVAILABLE_MONTHS_BY_YEAR=mby;
        AVAILABLE_YEARS=years;
      }
      setReady(true);
    }).catch(e=>{
      console.error('載入失敗:',e);
      setErr('數據載入失敗：'+e.message);
    });
  },[]);

  if(err)return(
    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-6">
      <div className="bg-white rounded-2xl p-12 text-center border shadow-sm max-w-md">
        <div className="text-5xl mb-4">❌</div>
        <div className="text-lg font-bold text-gray-600 mb-2">載入失敗</div>
        <div className="text-sm text-gray-400 mb-2">{err}</div>
        <button onClick={()=>location.reload()} className="mt-4 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700">🔄 重試</button>
      </div>
    </div>
  );

  if(!ready)return(
    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
      <div className="text-center">
        <div className="text-5xl mb-4 animate-bounce">📊</div>
        <div className="text-lg font-bold text-gray-500">載入數據中...</div>
        <div className="text-sm text-gray-300 mt-2">正在連接 Google Sheets</div>
      </div>
    </div>
  );

  return <DashboardContent initICs={loadedRosters.ics} initStaff={loadedRosters.staff} rawResponses={rawResponses}/>;
}

// ═══════════════════════════════════════
// 📊 DASHBOARD CONTENT
// ═══════════════════════════════════════
function DashboardContent({initICs,initStaff,rawResponses}){
  const latestYear=AVAILABLE_YEARS[AVAILABLE_YEARS.length-1]||new Date().getFullYear();
  const latestMonths=AVAILABLE_MONTHS_BY_YEAR[latestYear]||[];
  const latestMonth=latestMonths[latestMonths.length-1]||new Date().getMonth()+1;

  const[selYear,setSelYear]=useState(latestYear);
  const[selMonth,setSelMonth]=useState(latestMonth);
  const[tab,setTab]=useState(0);
  const[selStaff,setSelStaff]=useState('');
  const[selIC,setSelIC]=useState('');
  const[yearlyYear,setYearlyYear]=useState(latestYear);
  const[showYoY,setShowYoY]=useState(false);
  const[icRoster,setIcRoster]=useState(initICs);
  const[staffRoster,setStaffRoster]=useState(initStaff);
  const[showAddModal,setShowAddModal]=useState(null);
  const[newFull,setNewFull]=useState('');
  const[newNick,setNewNick]=useState('');
  const[toast,setToast]=useState('');
  const[confirmDel,setConfirmDel]=useState(null);
  const[deletingRow,setDeletingRow]=useState(null);

  const nicknameMap=useMemo(()=>{const m={};[...icRoster,...staffRoster].forEach(r=>{m[r.fullName]=r.nickname;});return m;},[icRoster,staffRoster]);
  const sn=(name)=>nicknameMap[name]||name.split(' ').pop();
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(''),2500);};
  const wIcon=(w)=>w==='晴天'?'☀️':w==='間歇落雨'?'🌦️':'⛈️';

  const filteredRaw=useMemo(()=>{
    const prefix=`${selYear}-${String(selMonth).padStart(2,'0')}`;
    return rawResponses.filter(row=>{const d=parseDate(row.date);return d.startsWith(prefix);}).sort((a,b)=>parseDate(b.date).localeCompare(parseDate(a.date)));
  },[rawResponses,selYear,selMonth]);

  const handleDeleteRecord=async(row)=>{
    if(deletingRow)return;
    const name=String(row.name||'');
    const date=parseDate(row.date);
    const cap=row.captures||0;
    if(!window.confirm(`確定刪除呢條記錄？\n\n👤 同事：${name}\n📅 日期：${date}\n📸 Captures：${cap}\n\n⚠️ 刪除後無法復原！`))return;
    setDeletingRow(row._row);
    try{
      const resp=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'deleteRecord',row:row._row,name:name})});
      const result=await resp.json();
      if(result.success){showToast('✅ 記錄已刪除，重新載入中...');setTimeout(()=>window.location.reload(),1200);}
      else{showToast('❌ '+result.message);setDeletingRow(null);}
    }catch(e){showToast('❌ 刪除失敗：'+e.message);setDeletingRow(null);}
  };

  const toggleActive=async(type,id)=>{
    const roster=type==='ic'?icRoster:staffRoster;
    const item=roster.find(r=>r.id===id);if(!item)return;
    if(type==='ic')setIcRoster(prev=>prev.map(r=>r.id===id?{...r,active:!r.active}:r));
    else setStaffRoster(prev=>prev.map(r=>r.id===id?{...r,active:!r.active}:r));
    try{await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'updateRoster',rosterType:type,operation:'toggle',nickname:item.nickname})});}catch(e){console.error(e);}
  };

  const handleAdd=async()=>{
    if(!newFull.trim()||!newNick.trim()){showToast('⚠️ 請填寫全名同顯示名');return;}
    const roster=showAddModal==='ic'?icRoster:staffRoster;
    if(roster.some(r=>r.fullName.toLowerCase()===newFull.trim().toLowerCase())){showToast('⚠️ 呢個名已經存在');return;}
    const entry={id:Date.now(),fullName:newFull.trim(),nickname:newNick.trim(),active:true};
    if(showAddModal==='ic')setIcRoster(prev=>[...prev,entry]);
    else setStaffRoster(prev=>[...prev,entry]);
    showToast('✅ 已新增 '+newNick.trim());
    try{await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'updateRoster',rosterType:showAddModal,operation:'add',fullName:newFull.trim(),nickname:newNick.trim()})});}catch(e){console.error(e);}
    setNewFull('');setNewNick('');setShowAddModal(null);
  };

  const handleDelete=async()=>{
    if(!confirmDel)return;
    if(confirmDel.type==='ic')setIcRoster(prev=>prev.filter(r=>r.id!==confirmDel.id));
    else setStaffRoster(prev=>prev.filter(r=>r.id!==confirmDel.id));
    showToast('🗑️ 已刪除 '+confirmDel.name);
    try{await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'updateRoster',rosterType:confirmDel.type,operation:'delete',nickname:confirmDel.name})});}catch(e){console.error(e);}
    setConfirmDel(null);
  };

  const activeICs=icRoster.filter(r=>r.active);
  const inactiveICs=icRoster.filter(r=>!r.active);
  const activeStaff=staffRoster.filter(r=>r.active);
  const inactiveStaff=staffRoster.filter(r=>!r.active);

  const dataKey=`${selYear}-${String(selMonth).padStart(2,'0')}`;
  const data=ALL_DATA[dataKey]||[];
  const weeks=useMemo(()=>getWeeksForMonth(selYear,selMonth),[selYear,selMonth]);
  const hasData=data.length>0;
  const availableMonths=AVAILABLE_MONTHS_BY_YEAR[selYear]||[];
  const hasAnyData=AVAILABLE_YEARS.length>0;

  const staffList=useMemo(()=>getStaffList(data),[dataKey]);
  const activeSelStaff=selStaff&&staffList.includes(selStaff)?selStaff:(staffList[0]||'');
  const staffEntries=getStaffEntries(activeSelStaff,data);
  const staffWeekly=getStaffWeekly(activeSelStaff,data,weeks);
  const staffMonthly=getStaffMonthly(activeSelStaff,data);
  const weeklyOverview=getWeeklyOverview(data,weeks);
  const weatherStats=getWeatherStats(data);

  const icList=useMemo(()=>getICList(data),[dataKey]);
  const rankedICs=useMemo(()=>{const r=rankICs(data);return r.map(ic=>({...ic,_sn:sn(ic.name)}));},[dataKey,nicknameMap]);
  const activeIC=selIC&&icList.includes(selIC)?selIC:(icList[0]||'');
  const icStats=activeIC?getICStats(activeIC,data):null;
  const icStaffList=activeIC?getStaffUnderIC(activeIC,data):[];
  const icDailyRecords=activeIC?data.filter(r=>r.ic===activeIC):[];

  const yearlyMonthly=useMemo(()=>getYearlyMonthly(yearlyYear),[yearlyYear]);
  const yearlyStaff=useMemo(()=>getYearlyStaffRank(yearlyYear),[yearlyYear]);
  const yearlyIC=useMemo(()=>getYearlyICRank(yearlyYear),[yearlyYear]);
  const curYearSummary=useMemo(()=>calcYearSummary(yearlyYear),[yearlyYear]);
  const prevYear=yearlyYear-1;
  const hasPrevYear=AVAILABLE_YEARS.includes(prevYear);
  const prevYearSummary=useMemo(()=>hasPrevYear?calcYearSummary(prevYear):null,[yearlyYear]);
  const prevYearlyMonthly=useMemo(()=>hasPrevYear?getYearlyMonthly(prevYear):[],[yearlyYear]);

  const total=data.length;const workDays=data.filter(r=>r.weather!=='惡劣天氣').length;const totalFgT=data.filter(r=>r.fgT).reduce((a,r)=>a+r.fgT,0);const totalFgR=data.filter(r=>r.fgR).reduce((a,r)=>a+r.fgR,0);
  const totalCaptures=data.reduce((a,r)=>a+r.staff.reduce((s,st)=>s+st.c,0),0);
  const staffBarData=staffList.slice(0,6).map(n=>{const e=getStaffEntries(n,data);return{name:sn(n),Captures:e.reduce((s,x)=>s+x.c,0)};});
  const weeklyChart=staffWeekly.filter(w=>w.days>0).map(w=>({name:w.key,'日均Cap':parseFloat(w.avgC),'Hit':parseFloat(w.avgH)||0,'帶返去':parseFloat(w.avgB)||0}));

  const handleYearChange=(e)=>{const y=Number(e.target.value);setSelYear(y);const ms=AVAILABLE_MONTHS_BY_YEAR[y]||[];if(!ms.includes(selMonth)&&ms.length)setSelMonth(ms[ms.length-1]);};

  const radarData=rankedICs.length>0?[{dim:'日均Cap（30%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.cap]))},{dim:'日均FG（25%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.fg]))},{dim:'Roving%（20%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.rov]))},{dim:'Hit率（15%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.hit]))},{dim:'帶返去（10%）',...Object.fromEntries(rankedICs.map(r=>[sn(r.name),r.breakdown.bring]))}]:[];
  const radarColors=['#6366f1','#f59e0b','#10b981','#ef4444','#3b82f6'];

  const yoyMonthlyData=useMemo(()=>{if(!hasPrevYear)return[];const allMonths=new Set();yearlyMonthly.forEach(m=>allMonths.add(m.month));prevYearlyMonthly.forEach(m=>allMonths.add(m.month));return Array.from(allMonths).sort((a,b)=>a-b).map(m=>({month:m,label:MONTHS_LABEL[m],cur:yearlyMonthly.find(x=>x.month===m),prev:prevYearlyMonthly.find(x=>x.month===m)}));},[yearlyYear]);
  const yoyChartCap=yoyMonthlyData.filter(d=>d.cur||d.prev).map(d=>({name:d.label,[yearlyYear]:d.cur?.totalCap||0,[prevYear]:d.prev?.totalCap||0}));
  const yoyChartFg=yoyMonthlyData.filter(d=>d.cur||d.prev).map(d=>({name:d.label,[yearlyYear]:d.cur?.fgT||0,[prevYear]:d.prev?.fgT||0}));

  const RosterTable=({type,roster,activeList,inactiveList})=>(<div className="space-y-3"><div className="flex items-center justify-between"><div className="flex items-center gap-3"><span className="text-sm font-bold text-gray-700">{type==='ic'?'🧑‍💼 IC 名單':'👤 Roving 同事名單'}</span><span className="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded-lg">{activeList.length} 啟用</span>{inactiveList.length>0&&<span className="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-0.5 rounded-lg">{inactiveList.length} 停用</span>}</div><button onClick={()=>{setShowAddModal(type);setNewFull('');setNewNick('');}} className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-indigo-700 shadow-sm">＋ 新增{type==='ic'?'IC':'同事'}</button></div><div className="bg-gray-50 rounded-xl p-3 border border-gray-100"><table className="w-full text-sm"><thead><tr className="border-b border-gray-200"><th className="text-left p-2 text-xs font-semibold text-gray-500">全名</th><th className="text-left p-2 text-xs font-semibold text-gray-500">顯示名</th><th className="text-center p-2 text-xs font-semibold text-gray-500">狀態</th><th className="text-center p-2 text-xs font-semibold text-gray-500">數據</th><th className="text-center p-2 text-xs font-semibold text-gray-500">操作</th></tr></thead><tbody>{roster.map(r=>{const hasHistory=type==='ic'?Object.values(ALL_DATA).some(arr=>arr.some(d=>d.ic===r.fullName)):Object.values(ALL_DATA).some(arr=>arr.some(d=>d.staff.some(s=>s.name===r.fullName)));return(<tr key={r.id} className={`border-b border-gray-100 ${r.active?'':'bg-gray-100 opacity-60'}`}><td className="p-2 font-medium text-gray-700 text-xs">{r.fullName}</td><td className="p-2"><span className={`px-2 py-0.5 rounded-lg text-xs font-bold ${r.active?'bg-indigo-100 text-indigo-700':'bg-gray-200 text-gray-500'}`}>{r.nickname}</span></td><td className="p-2 text-center"><button onClick={()=>toggleActive(type,r.id)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${r.active?'bg-emerald-500':'bg-gray-300'}`}><span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow-sm ${r.active?'translate-x-6':'translate-x-1'}`}/></button></td><td className="p-2 text-center">{hasHistory?<span className="text-xs text-amber-600 font-medium">📊</span>:<span className="text-xs text-gray-300">—</span>}</td><td className="p-2 text-center">{hasHistory?<span className="text-xs text-gray-300">🔒</span>:<button onClick={()=>setConfirmDel({type,id:r.id,name:r.nickname})} className="text-xs text-rose-400 hover:text-rose-600 font-bold">🗑️</button>}</td></tr>);})}</tbody></table></div></div>);

  // ═══════════════════════════════════════
  // 🎨 RENDER
  // ═══════════════════════════════════════
  return(
    <div className="min-h-screen bg-gray-50 p-3 md:p-6">
      <div className="max-w-5xl mx-auto">
        {toast&&<div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-gray-900 text-white text-sm font-semibold px-6 py-3 rounded-xl shadow-2xl">{toast}</div>}

        <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-500 rounded-2xl p-6 mb-4 text-white relative overflow-hidden">
          <div className="absolute top-0 right-0 w-40 h-40 bg-white opacity-5 rounded-full -translate-y-10 translate-x-10"/>
          <div className="relative"><div className="text-sm opacity-70 mb-1 font-medium">📊 Roving Performance Dashboard</div><div className="text-2xl font-bold mb-1">後台數據總覽</div><div className="text-sm opacity-60">Manager View · 數據來自 Google Sheets 即時同步</div></div>
        </div>

        {!hasAnyData&&tab<7?(
          <div className="bg-white rounded-2xl p-16 text-center border border-gray-100 shadow-sm">
            <div className="text-5xl mb-4">📭</div>
            <div className="text-lg font-bold text-gray-500 mb-2">暫時未有任何數據</div>
            <div className="text-sm text-gray-400 mb-6">請用 Daily Report Form 提交第一份日報</div>
            <a href="form.html" className="inline-block bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700">📝 去填 Form</a>
          </div>
        ):(
        <>
        <div className="bg-white rounded-2xl p-4 mb-4 border border-gray-100 shadow-sm flex flex-wrap items-center gap-4">
          <div className="flex items-center gap-2"><span className="text-sm font-bold text-gray-500">📅 年份</span><select value={selYear} onChange={handleYearChange} className="bg-gray-50 border border-gray-200 text-gray-700 font-semibold text-sm rounded-xl px-4 py-2.5 cursor-pointer">{AVAILABLE_YEARS.map(y=><option key={y} value={y}>{y} 年</option>)}</select></div>
          <div className="w-px h-8 bg-gray-200 hidden md:block"/>
          <div className="flex items-center gap-2"><span className="text-sm font-bold text-gray-500">🗓️ 月份</span><select value={selMonth} onChange={e=>setSelMonth(Number(e.target.value))} className="bg-gray-50 border border-gray-200 text-gray-700 font-semibold text-sm rounded-xl px-4 py-2.5 cursor-pointer">{availableMonths.map(m=><option key={m} value={m}>{m} 月</option>)}</select></div>
          <div className="ml-auto"><span className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg font-bold">{tab===5?`📆 ${yearlyYear} 年度`:tab===7?'⚙️ 人員管理':`${selYear} 年 ${MONTHS_LABEL[selMonth]}`}</span></div>
        </div>

        <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
          {TABS.map((t,i)=>(<button key={i} onClick={()=>setTab(i)} className={`whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-semibold transition-all ${tab===i?i===7?'bg-gray-800 text-white shadow-lg':'bg-indigo-600 text-white shadow-lg shadow-indigo-200':'bg-white text-gray-500 hover:bg-gray-100 border border-gray-100'}`}>{t}</button>))}
        </div>

        {!hasData&&tab<6&&(
          <div className="bg-white rounded-2xl p-16 text-center border border-gray-100 shadow-sm"><div className="text-5xl mb-4">📭</div><div className="text-lg font-bold text-gray-400 mb-2">{selYear} 年 {MONTHS_LABEL[selMonth]} 暫無數據</div><div className="text-sm text-gray-300">請選擇其他月份或提交日報</div></div>
        )}

        {/* ===== TAB 0: 總覽 ===== */}
        {hasData&&tab===0&&(<div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3"><StatCard icon="📅" label="總記錄日數" value={total} sub={`工作日 ${workDays} · 惡劣天氣 ${total-workDays}`} color="indigo"/><StatCard icon="📸" label="總 Captures" value={totalCaptures} color="amber"/><StatCard icon="💰" label="FG Cart 總收入" value={`$${totalFgT.toLocaleString()}`} color="green"/><StatCard icon="🎯" label="Roving 佔比" value={totalFgT?`${(totalFgR/totalFgT*100).toFixed(1)}%`:'—'} sub={`Roving $${totalFgR.toLocaleString()}`} color="blue"/></div>
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">🏆 同事 Captures 排名（{MONTHS_LABEL[selMonth]}）</div><ResponsiveContainer width="100%" height={200}><BarChart data={staffBarData} barGap={4}><CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/><XAxis dataKey="name" tick={{fontSize:11}}/><YAxis tick={{fontSize:11}}/><Tooltip/><Bar dataKey="Captures" fill="#6366f1" radius={[6,6,0,0]}/></BarChart></ResponsiveContainer></div>
        </div>)}

        {/* ===== TAB 1: 同事 ===== */}
        {hasData&&tab===1&&(<div className="space-y-4">
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-3 text-sm">👤 選擇同事</div><div className="flex flex-wrap gap-2">{staffList.map(s=>(<button key={s} onClick={()=>setSelStaff(s)} className={`px-3 py-2 rounded-xl text-xs font-semibold transition-all ${activeSelStaff===s?'bg-indigo-600 text-white shadow-md':'bg-gray-50 text-gray-500 hover:bg-gray-100 border border-gray-100'}`}>{sn(s)}</button>))}</div></div>
          {staffMonthly?(<>

            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">📊 每月</div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="text-left p-3 rounded-l-lg text-xs font-semibold text-gray-500">月份</th><th className="text-center p-3 text-xs font-semibold text-gray-500">工作日</th><th className="text-center p-3 text-xs font-semibold text-gray-500">總Cap</th><th className="text-center p-3 text-xs font-semibold text-gray-500">人均</th><th className="text-center p-3 text-xs font-semibold text-gray-500">FG總</th><th className="text-center p-3 text-xs font-semibold text-gray-500">Rov</th><th className="text-center p-3 rounded-r-lg text-xs font-semibold text-gray-500">佔比</th></tr></thead><tbody>{yearlyMonthly.map((m,i)=>(<tr key={i} className="border-b border-gray-50"><td className="p-3 font-semibold">{m.label}</td><td className="p-3 text-center">{m.workDays}日</td><td className="p-3 text-center font-bold text-indigo-600">{m.totalCap}</td><td className="p-3 text-center font-bold text-amber-600">{m.avgCap}</td><td className="p-3 text-center">${m.fgT.toLocaleString()}</td><td className="p-3 text-center text-emerald-600">${m.fgR.toLocaleString()}</td><td className="p-3 text-center"><span className="px-2 py-1 rounded-lg text-xs font-bold bg-indigo-100 text-indigo-700">{m.rovPct}%</span></td></tr>))}</tbody></table></div></div>
            {yearlyMonthly.length>1&&<div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">📈 趨勢</div><ResponsiveContainer width="100%" height={200}><LineChart data={yearlyMonthly.map(m=>({name:m.label,Captures:m.totalCap}))}><CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/><XAxis dataKey="name" tick={{fontSize:12}}/><YAxis tick={{fontSize:11}}/><Tooltip/><Line type="monotone" dataKey="Captures" stroke="#6366f1" strokeWidth={2.5} dot={{r:5,fill:'#6366f1'}}/></LineChart></ResponsiveContainer></div>}
            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">🏆 年度同事排名</div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="text-left p-3 rounded-l-lg text-xs font-semibold text-gray-500">#</th><th className="text-left p-3 text-xs font-semibold text-gray-500">同事</th><th className="text-center p-3 text-xs font-semibold text-gray-500">日數</th><th className="text-center p-3 text-xs font-semibold text-gray-500">總Cap</th><th className="text-center p-3 text-xs font-semibold text-gray-500">日均</th><th className="text-center p-3 text-xs font-semibold text-gray-500">Hit</th><th className="text-center p-3 rounded-r-lg text-xs font-semibold text-gray-500">帶返去</th></tr></thead><tbody>{yearlyStaff.map((s,i)=>(<tr key={i} className="border-b border-gray-50"><td className="p-3 text-xs">{rankMedal(i)}</td><td className="p-3 font-semibold text-xs">{sn(s.name)}</td><td className="p-3 text-center">{s.days}</td><td className="p-3 text-center font-bold text-indigo-600">{s.totalC}</td><td className="p-3 text-center font-bold text-amber-600">{s.avgC}</td><td className="p-3 text-center">{s.avgH!=='-'?<Stars val={Math.round(parseFloat(s.avgH))}/>:<span className="text-gray-300 text-xs">—</span>}</td><td className="p-3 text-center">{s.avgB!=='-'?<Stars val={Math.round(parseFloat(s.avgB))}/>:<span className="text-gray-300 text-xs">—</span>}</td></tr>))}</tbody></table></div></div>
            <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">🧑‍💼 年度 IC</div><div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="bg-gray-50"><th className="text-left p-3 rounded-l-lg text-xs font-semibold text-gray-500">IC</th><th className="text-center p-3 text-xs font-semibold text-gray-500">工作日</th><th className="text-center p-3 text-xs font-semibold text-gray-500">人手</th><th className="text-center p-3 text-xs font-semibold text-gray-500">總Cap</th><th className="text-center p-3 text-xs font-semibold text-gray-500">人均</th><th className="text-center p-3 text-xs font-semibold text-gray-500">FG日均</th><th className="text-center p-3 rounded-r-lg text-xs font-semibold text-gray-500">Rov%</th></tr></thead><tbody>{yearlyIC.map((ic,i)=>(<tr key={i} className="border-b border-gray-50"><td className="p-3 font-semibold text-xs">{rankMedal(i)} {sn(ic.name)}</td><td className="p-3 text-center">{ic.workDays}</td><td className="p-3 text-center"><span className="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-lg text-xs font-bold">{ic.avgHeadcount}</span></td><td className="p-3 text-center font-bold text-indigo-600">{ic.totalCap}</td><td className="p-3 text-center font-bold text-amber-600">{ic.avgCapPerStaff}</td><td className="p-3 text-center text-blue-600">${ic.fgDailyAvg.toLocaleString()}</td><td className="p-3 text-center"><span className="px-2 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-700">{ic.rovPct}</span></td></tr>))}</tbody></table></div></div>
          </>}
          {showYoY&&hasPrevYear&&prevYearSummary&&<>
            <div className="bg-gradient-to-br from-teal-50 to-emerald-50 rounded-2xl p-5 border border-teal-200"><div className="font-bold text-teal-800 text-lg mb-4">📊 YoY {prevYear} → {yearlyYear}</div><div className="grid grid-cols-2 md:grid-cols-4 gap-3">{[{icon:'📸',label:'總Cap',cur:curYearSummary.totalCap,prev:prevYearSummary.totalCap,fmt:v=>v.toLocaleString()},{icon:'💰',label:'FG總',cur:curYearSummary.fgT,prev:prevYearSummary.fgT,fmt:v=>`$${v.toLocaleString()}`},{icon:'🎯',label:'Rov',cur:curYearSummary.fgR,prev:prevYearSummary.fgR,fmt:v=>`$${v.toLocaleString()}`},{icon:'📅',label:'工作日',cur:curYearSummary.workDays,prev:prevYearSummary.workDays,fmt:v=>`${v}日`}].map((item,i)=>(<div key={i} className="bg-white rounded-xl p-4 border border-teal-100"><div className="text-xl mb-1">{item.icon}</div><div className="text-xs text-gray-400 mb-2">{item.label}</div><div className="text-xl font-bold text-teal-700">{item.fmt(item.cur)}</div><div className="flex items-center gap-2 mt-1"><span className="text-xs text-gray-400">{prevYear}: {item.fmt(item.prev)}</span><YoYBadge cur={item.cur} prev={item.prev}/></div></div>))}</div></div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">📸 YoY Captures</div><ResponsiveContainer width="100%" height={200}><BarChart data={yoyChartCap}><CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/><XAxis dataKey="name" tick={{fontSize:12}}/><YAxis tick={{fontSize:11}}/><Tooltip/><Legend iconSize={10} wrapperStyle={{fontSize:12}}/><Bar dataKey={prevYear} fill="#d1d5db" radius={[6,6,0,0]}/><Bar dataKey={yearlyYear} fill="#14b8a6" radius={[6,6,0,0]}/></BarChart></ResponsiveContainer></div><div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><div className="font-bold text-gray-700 mb-4 text-sm">💰 YoY FG</div><ResponsiveContainer width="100%" height={200}><BarChart data={yoyChartFg}><CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/><XAxis dataKey="name" tick={{fontSize:12}}/><YAxis tick={{fontSize:11}}/><Tooltip/><Legend iconSize={10} wrapperStyle={{fontSize:12}}/><Bar dataKey={prevYear} fill="#d1d5db" radius={[6,6,0,0]}/><Bar dataKey={yearlyYear} fill="#14b8a6" radius={[6,6,0,0]}/></BarChart></ResponsiveContainer></div></div>
          </>}
        </div>)}

        {/* ===== TAB 6: 數據 + 🗑️ 刪除功能 ===== */}
        {tab===6&&(<div className="space-y-4">
          <div className="bg-amber-50 rounded-2xl p-4 border border-amber-100">
            <div className="flex items-center gap-3"><span className="text-2xl">⚠️</span><div><div className="font-bold text-amber-700 text-sm">刪除記錄注意事項</div><div className="text-xs text-amber-600 mt-0.5">刪除後無法復原，頁面會自動重新載入更新數據。請確認後再操作。</div></div></div>
          </div>
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
            <div className="flex items-center justify-between mb-4">
              <div className="font-bold text-gray-700 text-sm">📋 記錄管理（{selYear}年{MONTHS_LABEL[selMonth]}）</div>
              <div className="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1.5 rounded-lg">共 {filteredRaw.length} 條記錄</div>
            </div>
            {filteredRaw.length===0?(
              <div className="text-center py-12"><div className="text-4xl mb-3">📭</div><div className="text-gray-400 font-semibold">{selYear} 年 {MONTHS_LABEL[selMonth]} 暫無記錄</div></div>
            ):(
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead><tr className="bg-gray-50">{['日期','天氣','IC','同事','角色','Cap','Hit','帶返去','FG Total','FG Rov','Remarks','操作'].map((h,i)=>(<th key={i} className="p-2.5 text-xs font-semibold text-gray-500 whitespace-nowrap">{h}</th>))}</tr></thead>
                  <tbody>{filteredRaw.map((row,i)=>{const d=parseDate(row.date);return(
                    <tr key={i} className="border-b border-gray-50 hover:bg-rose-50 group">
                      <td className="p-2.5 font-medium whitespace-nowrap">{d.slice(5)}</td>
                      <td className="p-2.5 text-center">{wIcon(String(row.weather||''))}</td>
                      <td className="p-2.5 whitespace-nowrap">{sn(String(row.ic||''))}</td>
                      <td className="p-2.5 text-indigo-600 font-semibold whitespace-nowrap">{sn(String(row.name||''))}</td>
                      <td className="p-2.5 text-center">{String(row.role||'')}</td>
                      <td className="p-2.5 text-center font-bold">{row.captures||''}</td>
                      <td className="p-2.5 text-center">{Number(row.hitRate)?<Stars val={Number(row.hitRate)}/>:'—'}</td>
                      <td className="p-2.5 text-center">{Number(row.bringBack)?<Stars val={Number(row.bringBack)}/>:'—'}</td>
                      <td className="p-2.5 text-center whitespace-nowrap">{row.fgTotal?`$${Number(row.fgTotal).toLocaleString()}`:''}</td>
                      <td className="p-2.5 text-center text-emerald-600 whitespace-nowrap">{row.fgRoving?`$${Number(row.fgRoving).toLocaleString()}`:''}</td>
                      <td className="p-2.5 text-gray-400 max-w-[120px] truncate">{row.remark||'—'}</td>
                      <td className="p-2.5 text-center">
                        <button onClick={()=>handleDeleteRecord(row)} disabled={!!deletingRow} className={`text-white text-xs font-bold px-2.5 py-1.5 rounded-lg transition-all ${deletingRow===row._row?'bg-gray-400 cursor-wait':'bg-rose-500 hover:bg-rose-600 opacity-50 group-hover:opacity-100'}`}>{deletingRow===row._row?'⏳':'🗑️'}</button>
                      </td>
                    </tr>
                  );})}</tbody>
                </table>
              </div>
            )}
          </div>
        </div>)}

        {/* ===== TAB 7: 設定 ===== */}
        {tab===7&&(<div className="space-y-6">
          <div className="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-6 text-white"><div className="text-xl font-bold mb-1">⚙️ 人員管理</div><div className="text-sm text-gray-300">加減 IC 同 Roving 同事 → 即時同步 Google Sheet</div></div>
          <div className="bg-blue-50 rounded-2xl p-5 border border-blue-100"><div className="font-bold text-blue-700 text-sm mb-3">💡 點樣運作？</div><div className="grid grid-cols-1 md:grid-cols-3 gap-3"><div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">🟢</div><div className="font-bold text-gray-700 text-sm">啟用 = Form 見到</div></div><div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">⚪</div><div className="font-bold text-gray-700 text-sm">停用 = Form 隱藏</div></div><div className="bg-white rounded-xl p-4 border border-blue-100 text-center"><div className="text-3xl mb-2">🗑️</div><div className="font-bold text-gray-700 text-sm">無記錄先可刪</div></div></div></div>
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><RosterTable type="ic" roster={icRoster} activeList={activeICs} inactiveList={inactiveICs}/></div>
          <div className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm"><RosterTable type="staff" roster={staffRoster} activeList={activeStaff} inactiveList={inactiveStaff}/></div>
          <div className="bg-emerald-50 rounded-2xl p-5 border border-emerald-200"><div className="font-bold text-emerald-700 text-sm mb-4">👁️ Form 預覽</div><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div className="bg-white rounded-xl p-4 border border-emerald-100"><div className="text-xs font-bold text-gray-500 mb-3">IC 選項</div>{activeICs.map(r=>(<div key={r.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2 mb-1"><span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"/><span className="text-sm">{r.fullName}</span><span className="text-xs text-gray-400 ml-auto">({r.nickname})</span></div>))}</div><div className="bg-white rounded-xl p-4 border border-emerald-100"><div className="text-xs font-bold text-gray-500 mb-3">同事選項</div>{activeStaff.map(r=>(<div key={r.id} className="flex items-center gap-2 bg-gray-50 rounded-lg px-3 py-2 mb-1"><span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"/><span className="text-sm">{r.fullName}</span><span className="text-xs text-gray-400 ml-auto">({r.nickname})</span></div>))}</div></div></div>
        </div>)}

        </>)}

        {/* ===== MODALS ===== */}
        <Modal open={!!showAddModal} onClose={()=>setShowAddModal(null)} title={`新增${showAddModal==='ic'?'IC':'同事'}`}>
          <div className="space-y-4">
            <div><label className="block text-xs font-bold text-gray-500 mb-1.5">全名</label><input value={newFull} onChange={e=>setNewFull(e.target.value)} placeholder="例如：Wong Tai Man Peter" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div><label className="block text-xs font-bold text-gray-500 mb-1.5">顯示名</label><input value={newNick} onChange={e=>setNewNick(e.target.value)} placeholder="例如：Peter" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div className="flex gap-3 pt-2"><button onClick={()=>setShowAddModal(null)} className="flex-1 bg-gray-100 text-gray-500 font-semibold py-3 rounded-xl text-sm">取消</button><button onClick={handleAdd} className="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md text-sm">✅ 確認</button></div>
          </div>
        </Modal>
        <Modal open={!!confirmDel} onClose={()=>setConfirmDel(null)} title="確認刪除">
          <div className="space-y-4">
            <div className="bg-rose-50 rounded-xl p-4 border border-rose-100 text-center"><div className="text-3xl mb-2">🗑️</div><div className="text-sm">確定刪除 <span className="font-bold text-rose-600">{confirmDel?.name}</span>？</div></div>
            <div className="flex gap-3"><button onClick={()=>setConfirmDel(null)} className="flex-1 bg-gray-100 text-gray-500 font-semibold py-3 rounded-xl text-sm">取消</button><button onClick={handleDelete} className="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl shadow-md text-sm">確認刪除</button></div>
          </div>
        </Modal>

        <div className="text-center text-xs text-gray-300 mt-8 pb-4">📊 Live Data · 數據來自 Google Sheets</div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard/>);
</script>
</body>
</html>
